[package]
name = "mhtml-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line tool (`mhtml`) to inspect and extract MHTML/MHT web archives into a browsable tree or a content-addressed S3 layout."
keywords = ["mhtml", "mht", "extract", "cli", "web-archive"]
categories = ["command-line-utilities", "web-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "mhtml"
path = "src/main.rs"

[dependencies]
mhtml.workspace = true
mhtml-serve.workspace = true
clap = { version = "4", features = ["derive"] }
url = "2"
percent-encoding = "2"
anyhow = "1"

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
tempfile = "3"
